<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Login Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4a261;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 28px;
      padding: 36px 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      transition: transform 0.2s ease;
    }

    /* Shake Animation for Wrong Credentials */
    .shake {
      animation: shakeCard 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shakeCard {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .avatar-wrapper {
      width: 90px;
      height: 90px;
      background: #ffe8d6;
      border-radius: 50%;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
    }

    h2 {
      color: #264653;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #7b8794;
      font-size: 13px;
      margin-bottom: 26px;
    }

    .input-box {
      position: relative;
      margin-bottom: 18px;
      text-align: left;
    }

    .input-box input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 2px solid #e2e8f0;
      outline: none;
      font-size: 14px;
      color: #2d3748;
      background: #f8fafc;
      transition: all 0.25s ease;
    }

    .input-box input:focus {
      border-color: #e76f51;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(231, 111, 81, 0.15);
    }

    /* Eye Toggle Icon Button */
    .toggle-pass-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      opacity: 0.6;
      padding: 4px;
    }

    .toggle-pass-btn:hover {
      opacity: 1;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: #2a9d8f;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="login-card" id="card">
    <div class="avatar-wrapper" id="avatar">🐵</div>
    <h2>Welcome Back</h2>
    <p class="subtitle">Please enter your details to sign in</p>

    <form onsubmit="handleLogin(event)">
      <div class="input-box">
        <input 
          type="text" 
          id="username" 
          placeholder="Username or Email" 
          required 
          onfocus="onUsernameFocus()" 
          onblur="onFieldBlur()"
        >
      </div>

      <div class="input-box">
        <input 
          type="password" 
          id="password" 
          placeholder="Password" 
          required 
          onfocus="onPasswordFocus()" 
          onblur="onFieldBlur()"
        >
        <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility()">👁️</button>
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
    </form>
  </div>

  <script>
    const avatar = document.getElementById('avatar');
    const passwordInput = document.getElementById('password');
    const card = document.getElementById('card');
    let isPasswordVisible = false;

    function onUsernameFocus() {
      avatar.innerText = '🐵';
      avatar.style.transform = 'scale(1.08) rotate(-3deg)';
    }

    function onPasswordFocus() {
      if (isPasswordVisible) {
        avatar.innerText = '🫣'; // Password dikh raha ho toh jhaankne lagega
      } else {
        avatar.innerText = '🙈'; // Password chhipa ho toh aankhein band
      }
      avatar.style.transform = 'scale(1.05)';
    }

    function onFieldBlur() {
      avatar.innerText = '🐵';
      avatar.style.transform = 'scale(1)';
    }

    function togglePasswordVisibility() {
      isPasswordVisible = !isPasswordVisible;

      if (isPasswordVisible) {
        passwordInput.type = 'text';
        avatar.innerText = '🫣'; // Ek aankh khol kar jhaankna
      } else {
        passwordInput.type = 'password';
        avatar.innerText = '🙈'; // Dono aankhein band
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const pass = passwordInput.value;

      // Demo condition: Agar password '1234' na ho toh shake karega
      if (pass !== '1234') {
        avatar.innerText = '🙉'; // Kaan band / mana karne ka expression
        card.classList.add('shake');
        setTimeout(() => {
          card.classList.remove('shake');
          avatar.innerText = '🐵';
        }, 500);
      } else {
        avatar.innerText = '🎉';
        alert('Welcome! Login successful.');
      }
    }
  </script>

</body>
</html>
