<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Login Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4a261; /* Screenshot jaisa warm aesthetic background */
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 28px;
      padding: 36px 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    /* Interactive Character/Avatar Area */
    .avatar-wrapper {
      width: 90px;
      height: 90px;
      background: #ffe8d6;
      border-radius: 50%;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
    }

    .login-card:focus-within .avatar-wrapper {
      transform: scale(1.1) rotate(-4deg);
    }

    h2 {
      color: #264653;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #7b8794;
      font-size: 13px;
      margin-bottom: 26px;
    }

    .input-box {
      position: relative;
      margin-bottom: 18px;
      text-align: left;
    }

    .input-box input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 2px solid #e2e8f0;
      outline: none;
      font-size: 14px;
      color: #2d3748;
      background: #f8fafc;
      transition: all 0.25s ease;
    }

    .input-box input:focus {
      border-color: #e76f51;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(231, 111, 81, 0.15);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: #2a9d8f;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      background: #21867a;
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="avatar-wrapper" id="avatar">👨‍💼</div>
    <h2>Welcome Back</h2>
    <p class="subtitle">Please enter your details to sign in</p>

    <form onsubmit="handleLogin(event)">
      <div class="input-box">
        <input type="text" id="username" placeholder="Username or Email" required onfocus="setAvatar('typing')" onblur="setAvatar('normal')">
      </div>

      <div class="input-box">
        <input type="password" id="password" placeholder="Password" required onfocus="setAvatar('blind')" onblur="setAvatar('normal')">
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
    </form>
  </div>

  <script>
    const avatar = document.getElementById('avatar');

    function setAvatar(state) {
      if (state === 'blind') {
        avatar.innerText = '🙈'; // Password type karte waqt aankh band
      } else if (state === 'typing') {
        avatar.innerText = '🧐'; // Email daalte waqt focus
      } else {
        avatar.innerText = '👨‍💼'; // Normal briefcase man
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      avatar.innerText = '🎉';
      alert('Login Successful!');
      setTimeout(() => setAvatar('normal'), 2000);
    }
  </script>

</body>
</html>
