<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Search Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 50px 20px; }
    h1 { font-size: 2.2rem; color: #38bdf8; margin-bottom: 25px; letter-spacing: -0.5px; }
    .search-box { width: 100%; max-width: 600px; display: flex; gap: 10px; margin-bottom: 30px; }
    input { width: 100%; padding: 14px 20px; font-size: 16px; border-radius: 30px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; transition: 0.2s; }
    input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
    #results { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: #1e293b; padding: 18px; border-radius: 12px; border: 1px solid #334155; text-align: left; }
    .card a { color: #38bdf8; font-size: 1.15rem; text-decoration: none; font-weight: 600; }
    .card a:hover { text-decoration: underline; }
    .card p { color: #94a3b8; font-size: 0.95rem; margin-top: 6px; line-height: 1.4; }
  </style>
</head>
<body>

  <h1>Nishant Search</h1>
  <div class="search-box">
    <input type="text" id="query" placeholder="Type karke search karein..." oninput="doSearch()">
  </div>

  <div id="results"></div>

  <script>
    let db = [];
    fetch('database.json')
      .then(res => res.json())
      .then(data => { db = data; })
      .catch(err => console.error("Database loading error:", err));

    function doSearch() {
      const q = document.getElementById('query').value.toLowerCase().trim();
      const resDiv = document.getElementById('results');
      resDiv.innerHTML = '';

      if (!q) return;

      const matches = db.filter(item => 
        item.title.toLowerCase().includes(q) || item.body.toLowerCase().includes(q)
      );

      if (matches.length === 0) {
        resDiv.innerHTML = '<p style="color:#64748b; text-align:center;">Koi result nahi mila.</p>';
        return;
      }

      matches.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <a href="${item.url}" target="_blank">${item.title}</a>
          <p>${item.body}</p>
        `;
        resDiv.appendChild(div);
      });
    }
  </script>
</body>
</html>
