<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unique Digital Space</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen">

  <header class="p-6 border-b border-slate-800 flex justify-between items-center max-w-5xl w-full mx-auto">
    <h1 class="text-xl font-bold tracking-wider text-teal-400">PROJECT://ZERO</h1>
    <span class="text-xs bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-slate-400">Live on GitHub</span>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center p-6 text-center max-w-3xl mx-auto">
    <div class="inline-block mb-4 p-2 px-4 rounded-full bg-teal-950/50 border border-teal-500/30 text-teal-300 text-sm">
      ✨ 100% Repository-Driven Project
    </div>
    <h2 class="text-4xl sm:text-5xl font-extrabold mb-6 leading-tight">
      इंटरनेट पर आज तक जो नहीं बना, <br/><span class="text-teal-400">यहाँ से शुरू होगा।</span>
    </h2>
    <p class="text-slate-400 text-base sm:text-lg mb-8 max-w-xl">
      यह प्रोजेक्ट बिना किसी भारी सर्वर सेटअप के पूरी तरह GitHub पर चलता और मैनेज होता है।
    </p>

    <div class="flex gap-4">
      <button onclick="changeQuote()" class="bg-teal-500 hover:bg-teal-400 text-slate-950 font-semibold px-6 py-3 rounded-lg transition-all">
        नया विचार लोड करें
      </button>
    </div>

    <div id="display-card" class="mt-8 p-6 bg-slate-900 border border-slate-800 rounded-xl text-slate-300 max-w-md w-full shadow-lg">
      "कन्वेंशनल आइडियाज की भीड़ में अपनी अलग जगह बनाओ।"
    </div>
  </main>

  <footer class="p-6 border-t border-slate-900 text-center text-xs text-slate-600">
    Built & Maintained Directly inside GitHub
  </footer>

  <script>
    const thoughts = [
      "कन्वेंशनल आइडियाज की भीड़ में अपनी अलग जगह बनाओ।",
      "सिर्फ कोड मत लिखो, डिजिटल आर्ट बनाओ।",
      "भविष्य उनका है जो एल्गोरिदम से आगे सोचते हैं।",
      "कम टूल्स, ज़्यादा क्रिएशन।"
    ];

    function changeQuote() {
      const card = document.getElementById('display-card');
      const random = thoughts[Math.floor(Math.random() * thoughts.length)];
      card.innerText = `"${random}"`;
    }
  </script>
</body>
</html>
