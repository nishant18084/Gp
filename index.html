<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEXUS - Social Feed</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top App Bar -->
  <header class="top-bar">
    <div class="app-title">NEXUSGRAM</div>
    <div class="top-icons">
      <span class="icon-btn">♡</span>
      <span class="icon-btn">⚡</span>
    </div>
  </header>

  <!-- Stories Section -->
  <section class="stories-container" id="stories-list"></section>

  <!-- Main Feed -->
  <main class="feed-container" id="posts-container"></main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchNav(this)">🏠</div>
    <div class="nav-item" onclick="switchNav(this)">🔍</div>
    <div class="nav-item" onclick="switchNav(this)">➕</div>
    <div class="nav-item" onclick="switchNav(this)">🎬</div>
    <div class="nav-item" onclick="switchNav(this)">👤</div>
  </nav>

  <!-- Load JavaScript -->
  <script src="app.js"></script>
</body>
</html>
