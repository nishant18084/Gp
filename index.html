<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Welcome Back</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f7a261;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 28px;
      padding: 40px 24px 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-box {
      width: 90px;
      height: 90px;
      background-color: #fcebd9;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 45px;
      margin-bottom: 20px;
      user-select: none;
      transition: all 0.2s ease;
    }

    h2 {
      color: #1e3a4c;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #7b8b95;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .form-group {
      width: 100%;
      position: relative;
      margin-bottom: 16px;
    }

    .input-field {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1.5px solid #d9e2ec;
      outline: none;
      font-size: 0.95rem;
      color: #334e68;
      background: #ffffff;
      transition: border-color 0.2s ease;
    }

    .input-field:focus {
      border-color: #f07f5e;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.1rem;
      opacity: 0.5;
      user-select: none;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #2a9d8f;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s ease;
    }

    .btn-submit:active {
      background-color: #21867a;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="avatar-box" id="avatar">🐵</div>
    
    <h2>Welcome Back</h2>
    <p class="subtitle">Please enter your details to sign in</p>

    <form id="loginForm" style="width: 100%;">
      <div class="form-group">
        <input type="text" id="username" class="input-field" placeholder="Username or Email" required autocomplete="off">
      </div>

      <div class="form-group">
        <input type="password" id="password" class="input-field" placeholder="Password" required>
        <span class="toggle-password" id="togglePass">👁️</span>
      </div>

      <button type="submit" class="btn-submit">Sign In</button>
    </form>
  </div>

  <script>
    const avatar = document.getElementById('avatar');
    const passwordInput = document.getElementById('password');
    const togglePass = document.getElementById('togglePass');
    const loginForm = document.getElementById('loginForm');

    // Monkey aankhein band karega jab password type ho
    passwordInput.addEventListener('focus', () => {
      avatar.textContent = '🙈';
    });

    passwordInput.addEventListener('blur', () => {
      avatar.textContent = '🐵';
    });

    // Show / Hide Password
    togglePass.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        avatar.textContent = '🐵';
      } else {
        passwordInput.type = 'password';
        avatar.textContent = '🙈';
      }
    });

    // Login Validation & Redirect
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = passwordInput.value.trim();

      if (username === "Admin" && password === "1234") {
        avatar.textContent = '🎉';
        
        // Alert aane ke baad OK karte hi dashboard par le jayega
        alert("Welcome! Login successful.");
        window.location.href = "dashboard.html";
      } else {
        alert("Invalid Username or Password!");
      }
    });
  </script>

</body>
</html>
